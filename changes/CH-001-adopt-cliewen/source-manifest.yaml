  # CAP-001 — event dispatch and timing parity. Source: TODO.md "DONE: Event-dispatch redesign".
  # Tier 2 conformance evidence is blocked on OQ-001 Q1 (test-robot licensing), so every one
  # of these resolves draft against M-001 rather than naming a test file that may not be built.
  - id: EVT-001
    disposition: draft
    justification: Events are stated to flow through the Bot API EventQueue with classic priorities, but the claim was verified by re-running battles and reading scores; no attributable test exists.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-002
    disposition: draft
    justification: The 0.33.1 dropped-deferred-event bug is described in the source as fixed by the upgrade, and its absence is exactly what has no regression test today.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-003
    disposition: draft
    justification: setInterruptible is stated to be NPE-guarded and scan-interrupt semantics to work again, evidenced only by ad.last.Bottom's inversion disappearing.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-004
    disposition: draft
    justification: Own-death reaching onDeath is stated as newly working; the source records that no DeathEvent case existed before, so this promise has never been tested.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-005
    disposition: draft
    justification: Classic new-turn timing at the end of execute() is stated as a property of bot-api 1.0.2 rather than as something this bridge checks.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-006
    disposition: draft
    justification: Custom event registration is implemented in the bridge's mapping helpers and exercised only incidentally by rumble bots.
    disposition-source-location: robocode-api/src/main/java/dev/robocode/tankroyale/bridge/CustomEventMapper.java
    plan-door: M-001
  - id: EVT-007
    disposition: draft
    justification: Other-robot death events are mapped but unverified independently of aggregate scores.
    disposition-source-location: robocode-api/src/main/java/dev/robocode/tankroyale/bridge/RobotDeathEventMapper.java
    plan-door: M-001
  - id: EVT-008
    disposition: draft
    justification: Skipped-turn reporting has no stated verification anywhere in the source corpus.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: EVT-009
    disposition: draft
    justification: Robot-thrown exception handling is observed through harness error counts, which cannot attribute a failure to this promise.
    disposition-source-location: compat-test/README.md "Test methodology (per jar)"
    plan-door: M-001
  - id: EVT-010
    disposition: draft
    justification: "Melee puts ten bots on the field, so a turn carries many scan events at one priority. That is the exact shape the 0.33.1 queue dropped, and the harness has never run a melee battle, so the division most likely to expose the bug class has no coverage at all."
    disposition-source-location: C:/robocode/roborumble/meleerumble.txt
    plan-door: M-001

  # CAP-002 — robot physics and state parity. Source: README.md's compatibility claim.
