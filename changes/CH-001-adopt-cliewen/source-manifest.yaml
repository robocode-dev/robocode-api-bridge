  # CAP-004 — robot file I/O sandboxing. Source: TODO.md item 4. Not implemented at all.
  - id: FIO-001
    disposition: draft
    justification: The bridge performs no path redirection; dz.Gir writing root paths produces roughly ten thousand access-denied errors under Tank Royale. The promise is stated and known to be unmet.
    disposition-source-location: TODO.md "4. File I/O sandboxing (RobocodeFileOutputStream emulation)"
    plan-door: M-004
  - id: FIO-002
    disposition: draft
    justification: getDataDirectory() was changed to match what getDataFile() resolves against, and the source states it has not been re-tested against the bot that surfaced the inconsistency.
    disposition-source-location: TODO.md "1. Commit pending bridge changes (done)"
    plan-door: M-004
  - id: FIO-003
    disposition: draft
    justification: RobocodeFileOutputStream's documentation states a 200000-byte cap that the implementation does not enforce.
    disposition-source-location: robocode-api/src/main/java/robocode/RobocodeFileOutputStream.java
    plan-door: M-004
  - id: FIO-004
    disposition: draft
    justification: Classic sandboxes all robot file I/O into the data directory; the bridge does not, and the source says so plainly.
    disposition-source-location: TODO.md "4. File I/O sandboxing (RobocodeFileOutputStream emulation)"
    plan-door: M-004

  # CAP-005 — score parity across the rumble collection.
  - id: SCORE-001
    disposition: human
    justification: "A maintainer reads the generated compatibility report and judges whether the population's parity is acceptable. That judgment is the instrument, not a stand-in for a missing test: the comparison is statistical, the run takes a night, and the threshold is a matter of interpretation rather than a machine verdict."
    disposition-source-location: compat-test/compatibility_report.md
    plan-door: M-006
  - id: SCORE-002
    disposition: draft
    justification: The regression watch list and its averaging gate do not exist yet; this change builds them.
    disposition-source-location: TODO.md "6. Full compat sweep"
    plan-door: M-001
  - id: SCORE-003
    disposition: draft
    justification: "A Tank-Royale-only exception is decided against the classic side's own signature baseline, so it is a machine verdict rather than a maintainer's judgment; it is draft only because the harness is Python, which is not a supported evidence carrier."
    disposition-source-location: compat-test/compatibility_report.md
    plan-door: M-001
  - id: SCORE-004
    disposition: draft
    justification: CodaFirst, Bl4ck, and Aetos score materially lower under Tank Royale with no errors logged; the source says these numbers predate the event-dispatch fix and must be re-tested before anything is concluded.
    disposition-source-location: TODO.md "2. Score-gap bots (TR lower, no errors)"
    plan-door: M-002
  - id: SCORE-005
    disposition: draft
    justification: ScalarR, Ar1, and BasicSurfer score materially higher under Tank Royale; the same re-test-first caveat applies.
    disposition-source-location: TODO.md "3. Score-gap bots (TR higher)"
    plan-door: M-003
  - id: SCORE-006
    disposition: draft
    justification: "MeleeRumble has 382 jars in the collection and no result of any kind on the Tank Royale side; parity for the division is unmeasured rather than unmet."
    disposition-source-location: C:/robocode/roborumble/meleerumble.txt
    plan-door: M-006

