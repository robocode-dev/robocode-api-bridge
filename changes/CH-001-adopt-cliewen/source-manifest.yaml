    disposition-source-location: TODO.md "2. Score-gap bots (TR lower, no errors)"
    plan-door: M-001
  - id: HARN-006
    disposition: draft
    justification: "Aborting the Tank Royale battle the moment an exception signature appears that the classic side did not produce. The behaviour does not exist yet; this change builds it."
    disposition-source-location: "OQ-001 Q2 resolution"
    plan-door: M-001
  - id: HARN-007
    disposition: draft
    justification: "Each division runs at its official rumble parameters rather than one approximated 1v1 setup. The parameters are read from the classic installation's rumble configuration; the harness currently hard-codes a single setup that matches none of them exactly."
    disposition-source-location: C:/robocode/roborumble/roborumble.txt
    plan-door: M-001
