  # CAP-007 — the compatibility harness. Its behavior is documented and real, but its
  # implementation is Python, which is not a supported evidence carrier (see A-003).
  - id: HARN-001
    disposition: draft
    justification: Checkpoint-and-resume is a mechanical property that deserves a machine check, and Python is not a supported evidence carrier, so badging it Human would launder a missing test as a judgment call.
    disposition-source-location: compat-test/README.md "Checkpointing / resume"
    plan-door: M-001
  - id: HARN-002
    disposition: draft
    justification: Process-tree termination on timeout is mechanical for the same reason as HARN-001.
    disposition-source-location: compat-test/README.md "Prerequisites"
    plan-door: M-001
  - id: HARN-003
    disposition: draft
    justification: Status classification is a pure function of scores and error counts and should be machine-checked once a carrier exists.
    disposition-source-location: compat-test/README.md "Status values"
    plan-door: M-001
  - id: HARN-004
    disposition: draft
    justification: The averaging regression mode does not exist yet; this change builds it.
    disposition-source-location: "TODO.md \"DONE: Event-dispatch redesign\""
    plan-door: M-001
  - id: HARN-005
